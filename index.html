  .wf-delta{font-size:13px;font-weight:700;color:#5ee9b5;background:rgba(16,185,129,.14);padding:5px 11px;border-radius:999px;}

  @keyframes catIconBounce{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.5) rotate(-10deg)}60%{transform:scale(.9) rotate(5deg)}80%{transform:scale(1.08) rotate(-3deg)}}
  .cat-card:active .cat-icon-anim{animation:catIconBounce .5s ease;}

  .segbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:0;background:rgba(21,15,48,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--stroke);padding:6px 0 env(safe-area-inset-bottom,0px);z-index:60;}
  .segbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 2px;border-radius:0;font-size:9px;font-weight:600;color:var(--dim);background:transparent;border:none;cursor:pointer;transition:color .18s;font-family:inherit;position:relative;overflow:hidden;}

  @keyframes segbounce{0%,100%{transform:scale(1)}30%{transform:scale(1.3)}60%{transform:scale(.92)}80%{transform:scale(1.06)}}
  @keyframes segripple{0%{transform:scale(0);opacity:.4}100%{transform:scale(3.5);opacity:0}}
  .seg-ripple{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(192,132,252,.25);pointer-events:none;transform:scale(0);animation:segripple .5s ease-out forwards;left:50%;top:50%;margin:-18px 0 0 -18px;}
  .pinfield{flex:1;border:1px solid var(--stroke);border-radius:11px;padding:11px;font-size:18px;letter-spacing:6px;text-align:center;background:rgba(255,255,255,.05);color:var(--ink);}

  .anim .stagger{opacity:0;animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards;}
  .anim .stagger:nth-child(2){animation-delay:.07s}.anim .stagger:nth-child(3){animation-delay:.14s}.anim .stagger:nth-child(4){animation-delay:.2s}

  /* M6.5.2 — Global close button system */
  .pf-close-btn{
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;
    flex:0 0 46px!important;
    display:inline-grid!important;
    place-items:center!important;
    padding:0!important;
    margin:0!important;
    border:1px solid rgba(234,179,8,.22)!important;
    border-radius:50%!important;
    background:rgba(255,255,255,.04)!important;
    color:var(--gold,#eab308)!important;
    box-shadow:0 6px 16px rgba(0,0,0,.12)!important;
    font-family:inherit!important;
    font-size:28px!important;
    font-weight:600!important;
    line-height:1!important;
    letter-spacing:0!important;
    text-align:center!important;
    cursor:pointer!important;
    touch-action:manipulation!important;
    -webkit-tap-highlight-color:transparent!important;
    transition:transform .16s ease,filter .16s ease,background .16s ease!important;
  }
  .pf-close-btn:hover{filter:brightness(1.12)}
  .pf-close-btn:active{transform:scale(.97)!important}
  .pf-close-btn:focus-visible{
    outline:2px solid rgba(234,179,8,.42)!important;
    outline-offset:3px!important;
  }
  body.light .pf-close-btn{
    background:rgba(234,179,8,.05)!important;
    border-color:rgba(180,125,0,.22)!important;
    box-shadow:0 6px 16px rgba(55,35,90,.08)!important;
  }
  @media(max-width:390px){
    .pf-close-btn{
      width:44px!important;
      height:44px!important;
      min-width:44px!important;
      min-height:44px!important;
      flex-basis:44px!important;
      font-size:27px!important;
    }
  }


  /* M6.5.3 — Tools close button correction */
  .m61-round-btn.pf-tools-close,
  .pf-tools-close{
    width:46px!important;
    height:46px!important;
    min-width:46px!important;
    min-height:46px!important;

  /* Disable the legacy generated X only for close controls. */
  .m61-round-btn.pf-tools-close::before,
  .m61-round-btn.pf-tools-close::after,
  .pf-tools-close::before,
  .pf-tools-close::after{
    content:none!important;
    display:none!important;
  }

  /* Restore a single consistent visible X when the legacy control has no text node. */
  .pf-tools-close:empty::before{
    content:"×"!important;
    display:block!important;
    position:static!important;
    width:auto!important;
    height:auto!important;
    transform:none!important;
    background:none!important;
    color:inherit!important;
    font:inherit!important;
    line-height:1!important;
  }

  .pf-tools-close:hover{filter:brightness(1.12)!important}

function migrate(p){
  if(!p.profile)p.profile={name:"",country:"MY",email:""};
  if(!p.profile.country)p.profile.country="MY";
  if(typeof p.profile.email!=="string")p.profile.email="";
  if(!p.settings)p.settings={autoCarry:false,pin:"",bio:false,bioId:""};
  if(typeof p.settings.autoCarry!=="boolean")p.settings.autoCarry=false;
  if(typeof p.settings.pin!=="string")p.settings.pin="";
  if(typeof p.settings.bio!=="boolean")p.settings.bio=false;
  if(typeof p.settings.bioId!=="string")p.settings.bioId="";
  if(typeof p.settings.privacyMode!=="boolean")p.settings.privacyMode=false;
  if(typeof p.settings.autoLockMin!=="number")p.settings.autoLockMin=0;
  if(typeof p.settings.lockOnBackground!=="boolean")p.settings.lockOnBackground=false;
  if(typeof p.settings.protectExports!=="boolean")p.settings.protectExports=false;
  if(typeof p.settings.failedUnlocks!=="number")p.settings.failedUnlocks=0;
  if(typeof p.settings.lastUnlock!=="number")p.settings.lastUnlock=0;
  if(typeof p.settings.autoRecurring!=="boolean")p.settings.autoRecurring=false;
  if(typeof p.settings.lastBackup!=="number")p.settings.lastBackup=0;
  if(!p.settings.uiStyle)p.settings.uiStyle="playful";
  if(typeof p.settings.sfx!=="boolean")p.settings.sfx=true;
  if(typeof p.settings.haptics!=="boolean")p.settings.haptics=true;
  if(typeof p.settings.theme!=="string")p.settings.theme="dark";
  p.settings.theme="dark"; // always dark
  if(typeof p.settings.onboarded!=="boolean")p.settings.onboarded=true;
  if(!p.books){p.books={};var home=p.profile.country||"MY";p.books[home]={months:p.months||{},receivables:p.receivables||[],budgets:{}};}
  if(!p.categories||!p.categories.length)p.categories=defaultCats();
  // Add Insurance category if missing
  if(!p.categories.some(function(c){return c.id==='insurance'||/insurance/i.test(c.name);})){
    var insIdx=p.categories.findIndex?p.categories.findIndex(function(c){return c.id==='family';}):5;
    p.categories.splice(insIdx>=0?insIdx:5,0,{id:'insurance',name:'Insurance',color:'#6366f1'});
  }
  if(!p.countries)p.countries=JSON.parse(JSON.stringify(COUNTRIES));
  Object.keys(p.countries).forEach(function(cc){if(!p.books[cc])p.books[cc]=emptyBook();var bk=p.books[cc];if(!bk.budgets)bk.budgets={};if(!bk.budgetPlans)bk.budgetPlans={};if(!bk.receivables)bk.receivables=[];if(!bk.payables)bk.payables=[];if(!bk.months)bk.months={};if(!bk.recurring)bk.recurring=[];if(!bk.goals)bk.goals=[];if(!bk.investments)bk.investments={holdings:[],history:[]};if(!Array.isArray(bk.investments.holdings))bk.investments.holdings=[];if(!Array.isArray(bk.investments.history))bk.investments.history=[];for(var k in bk.months){(bk.months[k].expenses||[]).forEach(function(r){if(typeof r.cat!=="string")r.cat="";});}});
  delete p.months;delete p.receivables;p.version=3;return p;
}

function getBanks(cc){
  if(!data.settings.bankAccounts)data.settings.bankAccounts={};
  if(!data.settings.bankAccounts[cc])data.settings.bankAccounts[cc]=[];
  return data.settings.bankAccounts[cc];
}
function getBankTotal(cc){return getBanks(cc).reduce(function(s,b){return s+(Number(bankBalForMonth(b))||0);},0);}
/* Per-month bank balance. Empty each month until entered (his workflow: fresh from bank monthly). */
function migrateLegacyBalance(b){
  /* Move a pre-monthly single b.balance into b.balances permanently, so it survives once other
     months are saved. Anchored to _legacyMonth (first month the account was viewed, or current). */
  if(!b) return;
  if(b.balances && Object.keys(b.balances).length) { b._legacyDone=true; return; }
  if(b._legacyDone) return;
  var changed=false;
  if(b.balance!=null && Number(b.balance)!==0){
    if(!b._legacyMonth)b._legacyMonth=mKey();
    if(!b.balances)b.balances={};
    if(b.balances[b._legacyMonth]==null){b.balances[b._legacyMonth]=Number(b.balance)||0;changed=true;}
  }
  b._legacyDone=true;
  if(changed){try{persist(data);}catch(e){}}
}
function bankBalForMonth(b,k){
  k=k||mKey();
  if(b && (!b._legacyDone)) migrateLegacyBalance(b);
  if(b && b.balances && b.balances[k]!=null && b.balances[k]!=="") return Number(b.balances[k])||0;
  return null; /* not yet entered for this month */
}
function bankBalDisplay(b,k){var v=bankBalForMonth(b,k);return v==null?null:v;}
function setBankBalForMonth(b,val,k){
  k=k||mKey();
  if(!b.balances)b.balances={};
  if(val===""||val==null){delete b.balances[k];}
  else{b.balances[k]=Number(val)||0;}
  /* keep b.balance mirroring the most recent entered month for any legacy reads */
  var keys=Object.keys(b.balances||{}).sort();
  b.balance = keys.length?Number(b.balances[keys[keys.length-1]])||0:0;
}

function importStatements(j,statusEl){
  var counts={income:0,expenses:0,skipped:0};

  // Find or create category ID by name
  function catIdByName(name){
    var cats=data.categories||[];
    var n=name.toLowerCase();
    for(var i=0;i<cats.length;i++){if(cats[i].name.toLowerCase()===n||cats[i].name.toLowerCase().indexOf(n)>-1||n.indexOf(cats[i].name.toLowerCase())>-1)return cats[i].id;}
    // Create it
    var colors=["#a855f7","#06b6d4","#10b981","#f59e0b","#ef4444","#8b5cf6","#ec4899","#14b8a6","#f97316","#6366f1"];

  // Detect format: new flat {income:[],expenses:[]} or old {maybank:{},hsbc:{}}
  var isNewFormat=Array.isArray(j.income)&&Array.isArray(j.expenses);

function m88FilterLabel(f){

function securityScore(){
  var s=data.settings,score=20;
  if(s.pin)score+=30;
  if(s.bio)score+=15;
  if(s.autoLockMin>0)score+=15;
  if(s.lockOnBackground)score+=10;
  if(s.protectExports)score+=5;
  if(s.privacyMode)score+=5;
  return Math.min(100,score);

function securityAuthorize(fn){
  if(!data.settings.protectExports||!data.settings.pin){fn();return;}
  var p=prompt("Enter your Packet Finz PIN to continue:");
  if(p===null)return;
  if(p===data.settings.pin){data.settings.lastUnlock=Date.now();persist(data);fn();}
  else{data.settings.failedUnlocks=(data.settings.failedUnlocks||0)+1;persist(data);toast("Incorrect PIN — action cancelled");}
}

function setupSwipeNav(){
  // M7.8.2 — one page-swipe controller aligned with the visible bottom navigation.
  var ORDER=["dashboard","accounts","calc","categories","reports","profilehub"];
  var sx=0,sy=0,startedAt=0,tracking=false,locked=false,startTarget=null;
  var BLOCK_SELECTOR="input,select,textarea,button,a,[contenteditable],.heat-grid,.msec,.lrow,.lrow2,.tx-row,.swipe-row,.tabs,.subtabs,.segbar,.calcpad,canvas,svg,[data-noswipe],.qsel,.overlay,.sheetov,.sheet,.modal";

  function reset(){tracking=false;startTarget=null;}
  function isOverlayOpen(){
    return state.locked||state.sheet||state.quickAdd||state.showCurrency||state.voiceAdd||
      state.budgetEdit||state.receiptReview||state.pinSet||state.fabOpen||state.goalEdit;
  }
  function isHorizontallyScrollable(node){
    while(node&&node!==document.body){
      if(node.scrollWidth&&node.clientWidth&&node.scrollWidth>node.clientWidth+8){
        var cs=window.getComputedStyle(node);
        if(/auto|scroll/.test(cs.overflowX||""))return true;
      }
      node=node.parentElement;
    }
    return false;
  }

  document.addEventListener("touchstart",function(e){
    reset();
    if(locked||e.touches.length!==1||isOverlayOpen())return;
    var t=e.target;
    if(t&&t.closest&&t.closest(BLOCK_SELECTOR))return;
    if(isHorizontallyScrollable(t))return;
    var touch=e.touches[0];
    sx=touch.clientX;sy=touch.clientY;startedAt=Date.now();startTarget=t;tracking=true;
  },{passive:true});

  document.addEventListener("touchend",function(e){
    if(!tracking)return;
    tracking=false;
    var touch=e.changedTouches&&e.changedTouches[0];
    if(!touch||locked||isOverlayOpen())return;
    var dx=touch.clientX-sx,dy=touch.clientY-sy,duration=Date.now()-startedAt;
    if(duration>900||Math.abs(dx)<75||Math.abs(dx)<Math.abs(dy)*1.35)return;

    var current=state.view;
    // Profile child screens are intentionally not part of page swiping.
    if(current==="profilemanage"||current==="settings")return;
    var i=ORDER.indexOf(current);if(i<0)return;
    var j=dx<0?i+1:i-1;
    if(j<0||j>=ORDER.length)return;

    locked=true;
    state.view=ORDER[j];
    window.scrollTo(0,0);buzz(8);go(false);
    setTimeout(function(){locked=false;},360);
  },{passive:true});

  document.addEventListener("touchcancel",reset,{passive:true});
}

function m62QuickMatch(r,q){

function m62Rows(){
  var f=m62Filters(),rows=[],months=book().months||{};
  Object.keys(months).forEach(function(k){

      (months[k][sec]||[]).forEach(function(r){
        rows.push({id:r.id,sec:sec,month:k,name:r.name||"",amount:Number(r.amount)||0,date:r.date||"",note:r.note||"",cat:r.cat||"",type:sec==="income"?"income":"expense",blob:JSON.stringify(r||{})});
      });
    });
  });
  var q=String(f.query||"").trim().toLowerCase();
  rows=rows.filter(function(r){
    if(q&&(r.name+" "+r.note+" "+m62Cat(r)+" "+r.amount+" "+r.date+" "+r.month+" "+(r.blob||"")).toLowerCase().indexOf(q)===-1)return false;
    if(f.type!=="all"&&r.type!==f.type)return false;
    if(f.category&&r.cat!==f.category)return false;
    if(f.dateFrom&&m62Time(r.date)<m62Time(f.dateFrom))return false;
    if(f.dateTo&&m62Time(r.date)>m62Time(f.dateTo))return false;
    if(f.minAmount!==""&&r.amount<Number(f.minAmount))return false;
    if(f.maxAmount!==""&&r.amount>Number(f.maxAmount))return false;
    return m62QuickMatch(r,f.quick);

function normalizeNavigationControls(){
  var closeActs=[
    "closeadvisor","closebankmodal","closebillsmodal","closebillsview","closebudget",
    "closecalendar","closeconv","closecur","closeflow","closegoalmodal","closegoalsview",
    "closehome","closeinvestments","closenotes","closepin","closeqa","closercpt",
    "closerecur","closerecuredit","closerecurringview","closeremit","closesearch",
    "closeshare","closesheet","closetx","invclosemodal","nwclose","calclosemodal",
    "budgetback","securityback","networthback","invclosemodal"
  ];
  document.querySelectorAll("button").forEach(function(btn){
    var act=(btn.getAttribute("data-act")||"").toLowerCase();
    var label=(btn.getAttribute("aria-label")||"").toLowerCase();
    var raw=(btn.textContent||"").trim();
    var hasSvg=!!btn.querySelector("svg");
    var isClose=
      label.indexOf("close")===0||
      closeActs.indexOf(act)>=0||
      raw==="×"||raw==="✕"||raw==="✖"||raw==="✗";
    var isBack=
      label.indexOf("back")===0||
      act==="backtools"||
      raw==="←";
    if(isClose&&raw!=="Cancel"&&raw!=="Done"&&raw!=="Back"){
      btn.classList.add("pf-nav-control","pf-nav-close");
      if(!hasSvg)btn.classList.add("pf-symbol-control");
    }else if(isBack){
      btn.classList.add("pf-nav-control","pf-nav-back");
      if(!hasSvg)btn.classList.add("pf-symbol-control");
    }
  });
}
